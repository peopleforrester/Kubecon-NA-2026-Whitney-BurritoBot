# ABOUTME: ArgoCD sync target for both BurritBot deployments (unguarded + guarded).
# ABOUTME: References the kustomization in apps/burritbot/k8s; do not duplicate yaml here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A directory with its own kustomization.yaml: kustomize's default
# LoadRestrictionsRootOnly refuses a file outside this directory (#76).
resources:
  - ../../apps/burritbot/k8s
