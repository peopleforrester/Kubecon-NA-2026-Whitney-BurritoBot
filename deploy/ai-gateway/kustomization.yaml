# ABOUTME: ArgoCD sync target for The Net — Envoy AI Gateway + the two scanner services.
# ABOUTME: Wires the Phase C2/C3 greenfield manifests so the gateway pipeline can route to them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Each entry is a directory with its own kustomization.yaml. kustomize's
# default LoadRestrictionsRootOnly refuses a file outside this directory
# but accepts a directory kustomization from anywhere (#76).
resources:
  # Gateway custom resources (Phase 5), the GatewayClass the Gateway names,
  # and the Vertex AI upstream the AIGatewayRoute routes to (WIF-authenticated).
  - ../../ai-gateway/envoy
  # NeMo Guardrails (Phase C2) — Deployment + Service + 2 ConfigMaps.
  - ../../ai-gateway/nemo-guardrails
  # ProtectAI scanner (Phase C3) — Deployment + Service + ConfigMap.
  - ../../ai-gateway/llm-guard
