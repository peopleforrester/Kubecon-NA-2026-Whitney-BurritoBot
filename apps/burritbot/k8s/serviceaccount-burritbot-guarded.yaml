# ABOUTME: ServiceAccount for guarded BurritBot — deliberately no WIF annotation.
# ABOUTME: Guarded BurritBot reaches Vertex only through the AI gateway's GSA.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: burritbot
  namespace: burritbot-guarded
  labels:
    app.kubernetes.io/name: burritbot
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: application
    burritbot.io/guarded: "true"
automountServiceAccountToken: true
