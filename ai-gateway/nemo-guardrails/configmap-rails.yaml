# ABOUTME: ConfigMap wrapping the four Colang 1.0 rails; mounted at /config-store/burritbot/rails/.
# ABOUTME: The microservice reads config id burritbot from config.yml + rails/ side by side in that directory.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-guardrails-rails
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
data:
  burrito-only.co: |
    # ABOUTME: Colang 1.0 input rail that keeps BurritBot to burritos: off-topic asks get a menu redirect.
    # ABOUTME: Matches phrases in the lower-cased $user_message; no menu word (salsa, party) is a trigger.

    define bot refuse off topic
      "I'm BurritBot — I can only help with the menu, hours, and locations. But if you want something seasonal, ask me about the carne asada bowl."

    # Input rails run before NeMo knows the user's intent, so they test the text itself.
    # Phrases, not single words, where a word hides in a menu ask ("disco" in "discount").
    # The phrases come from the canonical Act 1 asks: salsa dance moves, a hot dog
    # party, karaoke songs for a wedding, a beach party playlist, a disco routine,
    # a birthday party plan, the weather.
    define flow burrito only input
      $ask = $user_message.lower()
      if "dance" in $ask or "hot dog" in $ask or "karaoke" in $ask or "playlist" in $ask
        bot refuse off topic
        stop
      if "disco routine" in $ask or "plan a birthday party" in $ask or "weather" in $ask
        bot refuse off topic
        stop
  jailbreak-detect.co: |
    # ABOUTME: Colang 1.0 input rail that refuses prompt-injection / jailbreak attempts.
    # ABOUTME: Works in tandem with LLM Guard PromptInjection — belt-and-braces.

    define bot refuse jailbreak
      "I can't change who I am. I'm BurritBot, and I only answer burrito-related questions."

    # Phrases from the presenter-driven attacks: instruction overrides, DAN,
    # persona swaps and system prompt extraction.
    define flow jailbreak detect input
      $ask = $user_message.lower()
      if "ignore all previous instructions" in $ask or "ignore previous instructions" in $ask or "disregard the rules" in $ask
        bot refuse jailbreak
        stop
      if "you are now dan" in $ask or "do anything now" in $ask or "pretend you are not burritbot" in $ask
        bot refuse jailbreak
        stop
      if "system prompt" in $ask or "from now on respond as" in $ask or "act as a different assistant" in $ask or "roleplay as" in $ask
        bot refuse jailbreak
        stop
  output-sanitize.co: |
    # ABOUTME: Colang 1.0 output rail that blocks unsafe model replies before they hit the audience.
    # ABOUTME: Complements LLM Guard output scanners — NeMo matches leak phrases, LLM Guard handles content.

    define bot refuse to leak
      "I can't share that — here's what I can help with instead: the menu, hours, and locations."

    # Output rails see the generated reply as $bot_message. Two checks: the reply
    # reveals its system prompt, or it repeats injected instructions.
    define flow output sanitize
      $reply = $bot_message.lower()
      if "my system prompt is" in $reply or "my instructions are" in $reply or "i was told to" in $reply or "as an ai language model, i" in $reply
        bot refuse to leak
        stop
      if "ignore the previous" in $reply or "new instructions:" in $reply or "updated rules" in $reply
        bot refuse to leak
        stop
  topic-enforcement.co: |
    # ABOUTME: Colang 1.0 input rail refusing restricted topic categories beyond the burrito filter.
    # ABOUTME: Blocks medical, legal, financial, and political advice by phrase in $user_message.

    define bot refuse restricted topic
      "I can't help with that — I'm BurritBot and I only talk about the menu. Want to hear today's special?"

    # One check per category. Menu-adjacent words stay out: "stock" alone would catch
    # "is the carnitas in stock", "rash" alone would catch "trash".
    define flow topic enforcement input
      $ask = $user_message.lower()
      if "medication" in $ask or "symptom" in $ask or "diagnose" in $ask or "a rash" in $ask or "this rash" in $ask
        bot refuse restricted topic
        stop
      if "should i sue" in $ask or "lawsuit" in $ask or "enforceable" in $ask or "in court" in $ask
        bot refuse restricted topic
        stop
      if "buy this stock" in $ask or "stock market" in $ask or "crypto" in $ask or "invest" in $ask
        bot refuse restricted topic
        stop
      if "vote" in $ask or "president" in $ask or "election" in $ask or "better than party" in $ask
        bot refuse restricted topic
        stop
