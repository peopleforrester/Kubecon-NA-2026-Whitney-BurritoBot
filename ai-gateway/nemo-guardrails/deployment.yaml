# ABOUTME: NeMo Guardrails microservice — Deployment + Service in burritbot-net, with the burritbot-extproc sidecar.
# ABOUTME: Serves the burritbot config from a config store at /config-store/burritbot/ built from two ConfigMaps.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
    burritbot.io/guarded: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nemo-guardrails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemo-guardrails
        app.kubernetes.io/part-of: burritbot
        burritbot.io/layer: the-net
        burritbot.io/guarded: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # NGC images require a pull secret created from your NGC API key:
      #   kubectl create secret docker-registry nvidia-ngc-secret \
      #     --docker-server=nvcr.io --docker-username='$oauthtoken' \
      #     --docker-password=$NGC_API_KEY -n burritbot-net
      imagePullSecrets:
        - name: nvidia-ngc-secret
      containers:
        - name: nemo-guardrails
          image: nvcr.io/nvidia/nemo-microservices/guardrails:25.07
          imagePullPolicy: IfNotPresent
          # The 25.07 microservice's own contract (NVIDIA 25.7.0 guardrails
          # reference and configuration-store docs): it listens on
          # GUARDRAILS_PORT (default 7331) and serves each config id from a
          # directory of that name under CONFIG_STORE_PATH. The adapter's
          # SCANNER_URL and NEMO_GUARDRAILS_CONFIG_ID must match these, and
          # tests/test_nemo_guardrails_microservice.py checks that they do.
          ports:
            - name: http
              containerPort: 7331
          env:
            - name: GUARDRAILS_PORT
              value: "7331"
            - name: CONFIG_STORE_PATH
              value: /config-store
            # Requests that name no config id get burritbot, not the image's
            # "default", which this store does not have.
            - name: DEFAULT_CONFIG_ID
              value: burritbot
            - name: GOOGLE_CLOUD_PROJECT
              value: kk-community-projects
            - name: GOOGLE_CLOUD_LOCATION
              value: us-west1
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: nemo-guardrails
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The store's documented layout: <id>/config.yml beside <id>/rails/.
            - name: nemo-config
              mountPath: /config-store/burritbot/config.yml
              subPath: config.yaml
              readOnly: true
            - name: nemo-rails
              mountPath: /config-store/burritbot/rails
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/nemo/.cache
        # ext_proc adapter: Envoy speaks gRPC ext_proc, the scanner speaks REST.
        # It turns each buffered body into a call to the scanner on localhost.
        - name: burritbot-extproc
          image: us-west1-docker.pkg.dev/kk-community-projects/burritbot/burritbot-extproc:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: extproc
              containerPort: 50051
          env:
            - name: SCANNER
              value: nemo-guardrails
            - name: SCANNER_URL
              value: http://127.0.0.1:7331
            # Under the policy's messageTimeout (10s), so a slow scanner gets
            # this adapter's explicit 503, not Envoy's 500.
            - name: SCANNER_TIMEOUT_SECONDS
              value: "8"
            - name: EXTPROC_PORT
              value: "50051"
            # The refusal counter (burritbot.guardrails.refusals) goes to the collector over OTLP/gRPC.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: burritbot-extproc-nemo-guardrails
            - name: NEMO_GUARDRAILS_MODEL
              value: gemini-3-pro
            - name: NEMO_GUARDRAILS_CONFIG_ID
              value: burritbot
          readinessProbe:
            tcpSocket:
              port: extproc
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: extproc
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nemo-config
          configMap:
            name: nemo-guardrails-config
        - name: nemo-rails
          configMap:
            name: nemo-guardrails-rails
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-guardrails
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nemo-guardrails
  ports:
    - name: http
      port: 7331
      targetPort: http
      protocol: TCP
    - name: extproc
      port: 50051
      targetPort: extproc
      protocol: TCP
