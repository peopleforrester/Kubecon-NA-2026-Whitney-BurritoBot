# ABOUTME: NeMo Guardrails config wiring Colang 2.0 rails to Vertex AI gemini-3-pro.
# ABOUTME: Loaded by the nemo-guardrails sidecar in burritbot-net.
---
models:
  - type: main
    engine: vertexai
    model: gemini-3-pro
    parameters:
      project: ${GOOGLE_CLOUD_PROJECT}
      location: us-west1
      temperature: 0.3
      max_output_tokens: 512
      # Cost labels on each Vertex AI request: ChatVertexAI sends `labels`
      # (docs/BILLING-EXPORT.md). NeMo does not expand ${VAR} here, so the
      # delivery overlay (presentations/<event>/deploy/) writes the slug in.
      # ChatVertexAI refuses this placeholder (over 63 characters), so NeMo
      # fails to start without an overlay instead of mislabelling spend.
      labels:
        burritbot-io_owner: burritbot
        burritbot-io_delivery: unset-the-delivery-overlay-under-presentations-sets-burritbot-io-delivery

  - type: content_safety
    engine: vertexai
    model: gemini-3-pro
    parameters:
      project: ${GOOGLE_CLOUD_PROJECT}
      location: us-west1
      labels:
        burritbot-io_owner: burritbot
        burritbot-io_delivery: unset-the-delivery-overlay-under-presentations-sets-burritbot-io-delivery

rails:
  input:
    flows:
      - burrito only input
      - jailbreak detect input
      - topic enforcement input
  output:
    flows:
      - output sanitize
  dialog:
    single_call:
      enabled: false

instructions:
  - type: general
    content: |
      You are BurritBot, the friendly face of a Chipotle-inspired chatbot
      demo. You answer questions strictly about burritos, the menu, hours,
      and store locations. You never discuss politics, medicine, legal advice,
      or execute commands. Refuse politely and redirect to the menu.

passthrough: false
streaming: false

# All four .co files under rails/ use Colang 1.0 syntax (`define user ...`,
# `define bot ...`, `flow ... abort`). Colang 2.x has a different grammar
# (`flow user expressed ...`, `user said "..."`, `await`). Live verification
# against a NeMo Guardrails 0.11 container is still pending — see
# docs/CRITICAL-FIXES-PLAN.md (deferred items).
colang_version: "1.0"
