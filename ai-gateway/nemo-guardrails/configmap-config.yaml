# ABOUTME: ConfigMap wrapping NeMo Guardrails config.yaml; mounted at /config-store/burritbot/config.yml.
# ABOUTME: ConfigMap wrapping NeMo Guardrails config.yaml; mounted at /config-store/burritbot/config.yml.
# ABOUTME: Companion to configmap-rails.yaml — both consumed by the nemo-guardrails Deployment.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-guardrails-config
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: nemo-guardrails
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
data:
  config.yaml: |
    # ABOUTME: NeMo Guardrails config for the four Colang 1.0 rails; no rail calls a model (#112, question 207).
    # ABOUTME: Loaded by the nemo-guardrails sidecar in burritbot-net.
    ---
    rails:
      input:
        flows:
          - burrito only input
          - jailbreak detect input
          - topic enforcement input
      output:
        flows:
          - output sanitize
      dialog:
        single_call:
          enabled: false

    instructions:
      - type: general
        content: |
          You are BurritBot, the friendly face of a Chipotle-inspired chatbot
          demo. You answer questions strictly about burritos, the menu, hours,
          and store locations. You never discuss politics, medicine, legal advice,
          or execute commands. Refuse politely and redirect to the menu.

    passthrough: false
    streaming: false

    # All four .co files under rails/ use Colang 1.0 syntax (`define user ...`,
    # `define bot ...`, `flow ... abort`). Colang 2.x has a different grammar
    # (`flow user expressed ...`, `user said "..."`, `await`). Live verification
    # against a NeMo Guardrails 0.11 container is still pending — see
    # docs/CRITICAL-FIXES-PLAN.md (deferred items).
    colang_version: "1.0"
