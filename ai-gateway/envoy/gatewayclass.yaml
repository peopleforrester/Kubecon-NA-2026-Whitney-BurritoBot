# ABOUTME: GatewayClass envoy-ai-gateway — hands burritbot-ai-gateway to Envoy Gateway's controller.
# ABOUTME: The AI Gateway controller extends that controller; it does not own a GatewayClass of its own.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  # config.envoyGateway.gateway.controllerName in gitops/apps/envoy-gateway.yaml.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
