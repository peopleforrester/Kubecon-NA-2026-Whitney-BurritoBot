# ABOUTME: Envoy AI Gateway manifest — Gateway, HTTPRoute, AIGatewayRoute, and the guardrails ExtProc policy.
# ABOUTME: Lives in burritbot-net and is the single choke point for guarded BurritBot traffic.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: burritbot-ai-gateway
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/name: envoy-ai-gateway
    app.kubernetes.io/part-of: burritbot
spec:
  gatewayClassName: envoy-ai-gateway
  # The proxy pod's KSA calls Vertex AI via ADC; see vertex-ai-backend.yaml.
  infrastructure:
    annotations:
      iam.gke.io/gcp-service-account: burritbot-ai-gateway@kk-community-projects.iam.gserviceaccount.com
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: burritbot-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      # Only routes in burritbot-net attach: the audience HTTPRoute and the
      # HTTPRoute generated from the AIGatewayRoute both live here. Application
      # namespaces reach the gateway as backends, never as route owners.
      allowedRoutes:
        namespaces:
          from: Same
---
# Audience traffic (Act 2): the audience frontend posts /chat to the proxy
# Service with Host burritbot.burritbot.local, so this route wins. Any other
# Host falls to the hostname-less route generated from the AIGatewayRoute.
# The route timeout spans guarded BurritBot's whole /chat, its own gateway
# pass included, so it sits above BurritBot's GATEWAY_TIMEOUT_SECONDS (75).
# Unset, Envoy Gateway leaves Envoy's 15s default (tests/test_guarded_timeout_budget.py).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: burritbot-audience
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  parentRefs:
    - name: burritbot-ai-gateway
  hostnames:
    - burritbot.burritbot.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 80s
      backendRefs:
        - name: burritbot-guarded
          namespace: burritbot-guarded
          port: 8080
          weight: 100
---
# The route attaches to the Gateway itself; the AI Gateway controller generates
# an HTTPRoute of the same name and inserts its own ext_proc there. The upstream
# CRD has no targetRefs, schema or filters (the client schema is always OpenAI).
# Guarded BurritBot's model call lands here: an OpenAI /v1/chat/completions
# body sent to the proxy Service by name, which is not the audience hostname.
# The route stays hostname-less (spec.hostnames needs AI Gateway v0.7.0).
# The Vertex call gets 30s, not the AI Gateway's 60s default; BurritBot's
# GATEWAY_TIMEOUT_SECONDS covers it plus the guardrails ext_proc both ways.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: burritbot-gemini-route
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  parentRefs:
    - name: burritbot-ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            # Set by the gateway from the request body's "model" field.
            - type: Exact
              name: x-ai-eg-model
              value: gemini-3-pro
      timeouts:
        request: 30s
      backendRefs:
        - name: vertex-ai-gemini
          weight: 100
---
# The guardrails net: NeMo Guardrails, then LLM Guard, on every route attached
# to the gateway (the audience HTTPRoute and the HTTPRoute generated from the
# AIGatewayRoute above). Entries run in list order.
#
# Both scanners serve REST, not envoy.service.ext_proc.v3, so each entry names
# the extproc port (50051) of the burritbot-extproc sidecar in the scanner's
# pod (ai-gateway/extproc/adapter.py), never the scanner's own port 8000.
# failOpen stays unset (false): a broken net refuses traffic. messageTimeout
# replaces Envoy's 200ms default, which no scanner meets; it sits above the
# adapter's SCANNER_TIMEOUT_SECONDS so a slow scanner gets the adapter's 503.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: burritbot-guardrails
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: burritbot-ai-gateway
  extProc:
    - backendRefs:
        - name: nemo-guardrails
          port: 50051
      messageTimeout: 10s
      processingMode:
        request:
          body: Buffered
        response:
          body: Buffered
    - backendRefs:
        - name: llm-guard
          port: 50051
      messageTimeout: 10s
      processingMode:
        request:
          body: Buffered
        response:
          body: Buffered
