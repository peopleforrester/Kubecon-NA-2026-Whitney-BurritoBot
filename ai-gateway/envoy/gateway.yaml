# ABOUTME: Envoy AI Gateway 0.2+ manifest — Gateway, HTTPRoute, and AIGatewayRoute.
# ABOUTME: Lives in burritbot-net and is the single choke point for guarded BurritBot traffic.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: burritbot-ai-gateway
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/name: envoy-ai-gateway
    app.kubernetes.io/part-of: burritbot
spec:
  gatewayClassName: envoy-ai-gateway
  # The proxy pod's KSA calls Vertex AI via ADC; see vertex-ai-backend.yaml.
  infrastructure:
    annotations:
      iam.gke.io/gcp-service-account: burritbot-ai-gateway@kk-community-projects.iam.gserviceaccount.com
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: burritbot-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      # Only routes in burritbot-net attach: the AIGatewayRoute's targetRef
      # is local, so the HTTPRoute it guards must live here too. Application
      # namespaces reach the gateway as backends, never as route owners.
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: burritbot-audience
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  parentRefs:
    - name: burritbot-ai-gateway
  hostnames:
    - burritbot.burritbot.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: burritbot-guarded
          namespace: burritbot-guarded
          port: 8080
          weight: 100
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: burritbot-gemini-route
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  schema:
    name: OpenAI
  targetRefs:
    - name: burritbot-audience
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-model
              value: gemini-3-pro
      backendRefs:
        - name: vertex-ai-gemini
          weight: 100
  filters:
    - type: ExtProc
      extProc:
        backendRef:
          name: nemo-guardrails
          port: 8000
        processingMode:
          requestBody: BUFFERED
          responseBody: BUFFERED
    - type: ExtProc
      extProc:
        backendRef:
          name: llm-guard
          port: 8000
        processingMode:
          requestBody: BUFFERED
          responseBody: BUFFERED
