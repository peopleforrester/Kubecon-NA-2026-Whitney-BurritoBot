# ABOUTME: Vertex AI upstream for the AIGatewayRoute — AIServiceBackend, Envoy Backend, TLS, and auth.
# ABOUTME: Auth is GKE Workload Identity via ADC on the proxy pod; no service account key file exists.
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: vertex-ai-gemini
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  schema:
    name: GCPVertexAI
  backendRef:
    name: vertex-ai-gemini
    kind: Backend
    group: gateway.envoyproxy.io
  # Cost labels on every Vertex AI request (docs/BILLING-EXPORT.md). The
  # OpenAI → Vertex translator has no labels field; this mutation runs on the
  # translated body. The delivery overlay (presentations/<event>/deploy/)
  # replaces the placeholder, which is too long for a label value, so a sync
  # without an overlay has its model calls rejected rather than mislabelled.
  bodyMutation:
    set:
      - path: labels
        value: '{"burritbot-io_owner": "burritbot", "burritbot-io_delivery": "unset-the-delivery-overlay-under-presentations-sets-burritbot-io-delivery"}'
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vertex-ai-gemini
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  endpoints:
    - fqdn:
        hostname: us-west1-aiplatform.googleapis.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vertex-ai-gemini
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: vertex-ai-gemini
  validation:
    wellKnownCACertificates: System
    hostname: us-west1-aiplatform.googleapis.com
---
# GCPCredentials with neither credentialsFile nor workloadIdentityFederationConfig
# makes the ExtProc sidecar mint tokens from Application Default Credentials. On
# GKE that is the Envoy proxy pod's KSA (pinned by the EnvoyProxy below), which
# Workload Identity maps to the burritbot-ai-gateway GSA. ADC requires v1beta1.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: vertex-ai-gemini
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: vertex-ai-gemini
  type: GCPCredentials
  gcpCredentials:
    projectName: kk-community-projects
    region: us-west1
---
# Pins the Envoy proxy KSA name so the Terraform WIF binding can target it.
# The Gateway's spec.infrastructure.annotations carry the GSA annotation onto it.
# Also pins the proxy Service: Envoy Gateway runs it in its controller namespace
# (envoy-gateway-system) as envoy-<ns>-<gateway>-<hash> by default, so callers
# use burritbot-ai-gateway.envoy-gateway-system.svc.cluster.local:8080. ClusterIP
# keeps the default LoadBalancer from exposing the guarded gateway publicly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: burritbot-ai-gateway
  namespace: burritbot-net
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyServiceAccount:
        name: burritbot-ai-gateway
      envoyService:
        name: burritbot-ai-gateway
        type: ClusterIP
