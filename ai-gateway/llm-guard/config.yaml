# ABOUTME: llm-guard-api 0.3.16 scanner config (CONFIG_FILE): input and output scanners, each a type plus params.
# ABOUTME: Loaded by the llm-guard container in the burritbot-net gateway pod; schema is the API's app/config.py.
---
# Keys outside the API's schema are dropped unread, and each scanner's params
# are passed to its llm_guard 0.3.16 constructor, so an unknown param stops
# the API at startup. tests/test_llm_guard_api_image.py holds both.
app:
  # The OTel service.name; the API builds its resource from this, not OTEL_SERVICE_NAME.
  name: llm-guard
  log_level: INFO
  log_json: true
  # Load every scanner before uvicorn listens, so a Ready pod can scan. Lazy
  # loading would build them on the first audience prompt, past the adapter's
  # timeout, once per concurrent request.
  lazy_load: false

# No auth block: the burritbot-extproc adapter on 127.0.0.1 sends no credentials.

# OTLP/HTTP; with no endpoint here the exporters read OTEL_EXPORTER_OTLP_ENDPOINT.
tracing:
  exporter: otel_http
metrics:
  exporter: otel_http

input_scanners:
  - type: PromptInjection
    # The API always loads ProtectAI/deberta-v3-base-prompt-injection-v2 (ONNX).
    params:
      threshold: 0.85
  - type: TokenLimit
    params:
      limit: 1024
      encoding_name: cl100k_base
  - type: BanTopics
    # Act 1 of the demo invites audience members to submit lighthearted
    # off-topic prompts (dance moves, party planning, karaoke). BanTopics
    # is the second line of defense behind the burrito-only Colang rail —
    # it catches paraphrases the rail misses with zero-shot classification.
    params:
      threshold: 0.6
      topics:
        - dancing
        - parties
        - karaoke
        - coding
        - politics
        - medical advice
        - legal advice
        - financial advice
  - type: BanSubstrings
    params:
      match_type: word
      case_sensitive: false
      substrings:
        - "ignore previous"
        - "system prompt"
        - "jailbreak"
        - "developer mode"
        - "roleplay as"
  - type: Language
    params:
      valid_languages:
        - en
      threshold: 0.6
  - type: Anonymize
    params:
      hidden_names:
        - CHIPOTLE_EMPLOYEE
      entity_types:
        - CREDIT_CARD
        - US_SSN
        - EMAIL_ADDRESS
        - PHONE_NUMBER

output_scanners:
  - type: NoRefusal
    params:
      threshold: 0.7
  - type: Regex
    params:
      # Use double-escaped backslashes — YAML strips one layer.
      patterns:
        - "(?i)system\\s*prompt"
        - "(?i)ignore\\s+(all|the|previous)\\s+instructions"
        - "(?i)you\\s+are\\s+now"
      is_blocked: true
  - type: Sensitive
    params:
      entity_types:
        - CREDIT_CARD
        - US_SSN
        - EMAIL_ADDRESS
        - PHONE_NUMBER
      redact: true
  - type: Bias
    params:
      threshold: 0.8
  - type: MaliciousURLs
    params:
      threshold: 0.8
