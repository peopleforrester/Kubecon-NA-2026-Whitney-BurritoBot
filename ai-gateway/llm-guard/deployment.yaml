# ABOUTME: LLM Guard scanner service — Deployment + Service in burritbot-net, with the burritbot-extproc sidecar.
# ABOUTME: llm-guard-api 0.3.16 (derived image, ./Dockerfile) loads /config/config.yaml via CONFIG_FILE; downloads ~4.3 GiB of models.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: llm-guard
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
    burritbot.io/guarded: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-guard
        app.kubernetes.io/part-of: burritbot
        burritbot.io/layer: the-net
        burritbot.io/guarded: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-guard
          # Pinned tag; bump deliberately, never use :latest. 0.3.16 is the
          # last release: protectai/llm-guard was archived on 2026-07-08.
          # Built from ai-gateway/llm-guard/Dockerfile: laiyer/llm-guard-api:0.3.16
          # by digest plus spaCy's zh_core_web_sm, which Anonymize and Sensitive
          # load; without it spaCy pip-installs on the read-only root and exits.
          # The image runs as uid 1000 (HOME /home/user); every file in it is
          # world-readable, so it also runs as 1001 when its writes land on
          # the emptyDirs below.
          image: us-west1-docker.pkg.dev/kk-community-projects/burritbot/llm-guard-api:0.3.16-burritbot.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # entrypoint.sh hardcodes uvicorn --port=8000.
              containerPort: 8000
          env:
            # create_app() reads its config path from CONFIG_FILE (default
            # ./config/scanners.yml, the image's built-in config).
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: APP_WORKERS
              value: "1"
            # Where transformers and optimum download the scanner models. The
            # image's HOME stays /home/user: its packages live in /home/user/.local.
            - name: HF_HOME
              value: /home/user/.cache/huggingface
            # OTLP/HTTP; config.yaml's otel_http exporters append /v1/traces and /v1/metrics.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
          # lazy_load is false, so uvicorn listens only after every scanner
          # model is downloaded (about 4.3 GiB on a fresh pod) and loaded.
          # The startupProbe allows 15 minutes for that before liveness counts.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: llm-guard-config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              # tiktoken (TokenLimit) caches its encodings under /tmp.
              mountPath: /tmp
            - name: hf-cache
              # HF_HOME: the scanner models download here on first start.
              mountPath: /home/user/.cache/huggingface
        # ext_proc adapter: Envoy speaks gRPC ext_proc, the scanner speaks REST.
        # It turns each buffered body into a call to the scanner on localhost.
        - name: burritbot-extproc
          image: us-west1-docker.pkg.dev/kk-community-projects/burritbot/burritbot-extproc:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: extproc
              containerPort: 50051
          env:
            - name: SCANNER
              value: llm-guard
            - name: SCANNER_URL
              value: http://127.0.0.1:8000
            # Under the policy's messageTimeout (10s), so a slow scanner gets
            # this adapter's explicit 503, not Envoy's 500.
            - name: SCANNER_TIMEOUT_SECONDS
              value: "8"
            - name: EXTPROC_PORT
              value: "50051"
          readinessProbe:
            tcpSocket:
              port: extproc
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: extproc
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: llm-guard-config
          configMap:
            name: llm-guard-config
        - name: tmp
          emptyDir: {}
        - name: hf-cache
          emptyDir:
            # The configured scanners download about 4.3 GiB of ONNX models.
            sizeLimit: 6Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-guard
  namespace: burritbot-net
  labels:
    app.kubernetes.io/name: llm-guard
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-net
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-guard
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: extproc
      port: 50051
      targetPort: extproc
      protocol: TCP
