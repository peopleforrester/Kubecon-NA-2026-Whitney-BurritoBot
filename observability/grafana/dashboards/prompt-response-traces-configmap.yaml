# ABOUTME: ConfigMap wrapping the prompt-response-traces.json dashboard for Grafana sidecar import.
# ABOUTME: Phase B3 enables the kube-prometheus-stack Grafana sidecar with selector grafana_dashboard=1.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-prompt-response-traces
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: burritbot
    burritbot.io/layer: the-eyes
data:
  prompt-response-traces.json: |
    {
      "title": "BurritBot Prompt / Response Traces",
      "uid": "burritbot-prompt-response-traces",
      "description": "BurritBot's model-call spans (gen_ai.* attributes, latency, the net's refusals as error.type guardrails_refused) and p95 model-call latency per path.",
      "tags": [
        "burritbot",
        "traces",
        "gen_ai"
      ],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Recent model-call spans",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "queryType": "traceql",
              "query": "{ resource.service.name =~ \"burritbot-(guarded|unguarded)\" && span.gen_ai.operation.name = \"chat\" }",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency by path (guarded vs unguarded)",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, burritbot_guarded) (rate(burritbot_gen_ai_client_operation_duration_seconds_bucket[5m])))",
              "legendFormat": "guarded={{burritbot_guarded}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
