# ABOUTME: Wave -5: Kyverno admission controller; chart values adapted from kubeauto-ai-day.
# ABOUTME: Webhook exclusions guard against system-namespace deadlocks; webhooks listen on 10250.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    burritbot.io/layer: the-net
    app.kubernetes.io/part-of: burritbot
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.7.1
    helm:
      releaseName: kyverno
      valuesObject:
        # Exclude system namespaces from the admission webhook to avoid
        # the webhook depending on workloads it would itself be admitting.
        # Kyverno's own namespace is excluded by default
        # (excludeKyvernoNamespace: true on the chart).
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kube-public
                    - kube-node-lease
        # Private nodes: GKE's "-master" firewall rule lets the control
        # plane reach pods on TCP 443 and 10250 only, so the chart's 9443
        # would time out every admission call. 10250 is the port the
        # cert-manager and AI Gateway controller webhooks already use.
        # The chart's webhook NetworkPolicies hardcode 9443; keep them off.
        admissionController:
          replicas: 1
          webhookServer:
            port: 10250
          # The chart's probes hardcode 9443; point them at the named
          # webhook port. Helm merges the rest of each probe from the chart.
          startupProbe:
            httpGet:
              port: https
          livenessProbe:
            httpGet:
              port: https
          readinessProbe:
            httpGet:
              port: https
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        backgroundController:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        cleanupController:
          server:
            port: 10250
          # The chart's probes hardcode 9443; point them at the named
          # webhook port. Helm merges the rest of each probe from the chart.
          startupProbe:
            httpGet:
              port: https
          livenessProbe:
            httpGet:
              port: https
          readinessProbe:
            httpGet:
              port: https
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        reportsController:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
