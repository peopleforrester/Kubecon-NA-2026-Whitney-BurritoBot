# ABOUTME: Wave 2: audience-facing frontend + cast-net traffic toggle — last to sync.
# ABOUTME: Depends on BurritBot and the AI gateway already being Healthy upstream.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audience
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    burritbot.io/layer: application
    app.kubernetes.io/part-of: burritbot
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/burritobot.git
    targetRevision: main
    # The active delivery's overlay of deploy/audience: it sets the /chat
    # limits per browser token and per address (question 157).
    path: presentations/kubecon-na-2026/deploy/audience
  destination:
    server: https://kubernetes.default.svc
    namespace: audience
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
