[project]
name = "burritbot"
version = "0.1.0"
description = "burritbot — a reusable Kubernetes platform for live AI-guardrails demos (Envoy AI Gateway + NeMo Guardrails + LLM Guard + Kyverno + Falco + OTel)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
timeout = 120
markers = [
    "phase1: Phase 1 — GKE Foundation",
    "phase2: Phase 2 — GitOps Bootstrap",
    "phase3: Phase 3 — The Eyes (observability)",
    "phase4: Phase 4 — The Net — Security (Kyverno + Falco)",
    "phase5: Phase 5 — The Net — AI Gateway",
    "phase6: Phase 6 — BurritBot application",
    "phase7: Phase 7 — Audience frontend",
    "phase8: Phase 8 — Hardening",
    "static: Tests that can run without a live cluster",
    "live: Tests that require a live cluster / GCP auth",
    "research: Chatbot research subproject tests",
]

[tool.ruff.lint]
# Explicit set so a ruff upgrade does not silently widen the gate:
# pycodestyle errors, pyflakes, import order, pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# tests/ is on pytest's pythonpath, so conftest and helpers are local.
known-first-party = ["conftest", "helpers"]
lines-after-imports = 2

[dependency-groups]
dev = [
    "fastapi==0.135.3",
    "google-cloud-container>=2.50.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.18.0",
    "google-genai==1.71.0",
    "kubernetes>=35.0.0",
    "nemoguardrails>=0.22.0",
    "opentelemetry-api==1.41.0",
    "opentelemetry-instrumentation-fastapi==0.62b0",
    "opentelemetry-sdk==1.41.0",
    "pillow>=12.3.0",
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.2",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "ruff==0.17.1",
]
