# ABOUTME: Kyverno ClusterPolicy that generates a NetworkPolicy locking guarded BurritBot egress.
# ABOUTME: Guarded BurritBot can only reach the burritbot-net gateway's proxy pods, the OTel collector and DNS.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-burritbot-network
  annotations:
    policies.kyverno.io/title: Restrict Guarded BurritBot Egress
    policies.kyverno.io/category: burritbot / The Net
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: >-
      Generates a NetworkPolicy in the burritbot-guarded namespace that
      restricts egress to the proxy pods of the burritbot-net AI gateway
      (Envoy Gateway runs them in envoy-gateway-system), the OTel collector's
      OTLP/gRPC port in monitoring (its spans and metrics) and kube-system
      DNS only. If someone deletes the NetworkPolicy by hand, Kyverno re-creates
      it on the next reconcile — guarded BurritBot cannot escape the net.
spec:
  generateExisting: true
  rules:
    - name: generate-guarded-burritbot-egress-lock
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - burritbot-guarded
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: burritbot-guarded-egress-to-burritbot-net
        namespace: burritbot-guarded
        synchronize: true
        data:
          metadata:
            labels:
              burritbot.io/layer: the-net
              app.kubernetes.io/part-of: burritbot
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: burritbot
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: envoy-gateway-system
                    podSelector:
                      matchLabels:
                        gateway.envoyproxy.io/owning-gateway-name: burritbot-ai-gateway
                        gateway.envoyproxy.io/owning-gateway-namespace: burritbot-net
                ports:
                  - protocol: TCP
                    port: 8080
              # The collector DaemonSet's pods behind otel-collector.monitoring.svc
              # (gitops/apps/otel-collector.yaml); 4317 is OTLP/gRPC.
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: monitoring
                    podSelector:
                      matchLabels:
                        app.kubernetes.io/name: opentelemetry-collector
                        app.kubernetes.io/instance: otel-collector
                ports:
                  - protocol: TCP
                    port: 4317
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
