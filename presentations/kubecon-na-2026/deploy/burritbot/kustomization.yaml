# ABOUTME: This delivery's overlay of deploy/burritbot: names the delivery so model spend sums by label.
# ABOUTME: Sets BURRITBOT_DELIVERY on unguarded BurritBot, the slug Terraform applies with (RUNBOOK Night Before).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A directory with its own kustomization.yaml, so the default load
# restrictor accepts it from here (#76).
resources:
  - ../../../../deploy/burritbot

patches:
  - path: delivery-unguarded.yaml
